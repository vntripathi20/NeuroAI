[project]
name = "neuroai"
version = "0.1.0"
description = "Research project investigating speech-derived acoustic and linguistic markers of neurological conditions."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
